[project]
name = "asciiline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "numpy",
    "opencv-python-headless",
    "uvicorn[standard]",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["use_cases*", "ports*", "adapters*", "cli*"]

[tool.setuptools]
py-modules = ["stream_server", "ascii_video_player2", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, dead assignments)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (catches asyncio.get_event_loop() → get_running_loop())
    "B",   # flake8-bugbear (common bugs and anti-patterns)
    "I",   # isort (import ordering)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line-length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
