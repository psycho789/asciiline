[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, dead assignments)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (catches asyncio.get_event_loop() → get_running_loop())
    "B",   # flake8-bugbear (common bugs and anti-patterns)
    "I",   # isort (import ordering)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line-length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
